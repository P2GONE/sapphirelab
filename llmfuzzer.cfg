%YAML 1.2
---
Connection:
  Type: HTTP-API
  # Default to the local STYLE MARKET chatbot. Override per-run with
  # `./mmfuzz packet <file> --target <url>` or by editing this URL.
  Url: "http://localhost:5050/api/chat"
  Content: JSON
  Query-Attribute: "message"
  Output-Attribute: "reply"
  # LegacyBody: true   # uncomment to send the old {messages,parts,provider} schema
  Headers: {}
  Cookie: {}
  
Attacks:
    - Path: /attacks/promptInjection.atk
    - Path: /attacks/smuggling.atk
    - Path: /attacks/jailbreak.atk

Mutation:
  Enabled: false               # true = wrap each behavior in a mutated jailbreak template
  Provider: gemini             # anthropic | openai | gemini
  Model: gemini-2.0-flash
  # APIKey: "AIza..."          # or set GEMINI_API_KEY env var
  Temperature: 1.0
  MaxTokens: 512
  Strategies:                  # which GPTFuzz mutators to randomly pick from
    - GenerateSimilar
    - CrossOver
    - Expand
    - Shorten
    - Rephrase
  Concatenate: true            # append original template after mutated result
  SeedsPath: "../GPTFuzz/datasets/prompts/seed_short_25.csv"
  MaxRetries: 3                # refused → mutate → retry, up to N times
  RetryStrategies:             # direct mutators for retry (no placeholder needed)
    - DirectRephrase
    - DirectExpand
    - DirectShorten
    - DirectCrossOver

PacketFuzz:
  Placeholder: "AAAAAAAAAAAAAAAAAAA"
  DatasetPath: "HarmBench/data/behavior_datasets/harmbench_behaviors_text_test.csv"
  # SemanticCategories: [cybercrime_intrusion, illegal]
  # FunctionalCategories: [standard, contextual]
  # Limit: 20
  SavePoC: false

HarmBench:
  DatasetPath: "HarmBench/data/behavior_datasets/harmbench_behaviors_text_test.csv"
  # SemanticCategories: [cybercrime_intrusion, chemical_biological, illegal]
  # FunctionalCategories: [standard, contextual]
  # Limit: 50
  SavePoC: false

Reports:
    - HTML: true
      Path: "report.html"
    - CSV: true
      Path: "report.csv"
