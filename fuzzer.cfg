%YAML 1.2
---
Connection:
  Type: HTTP-API
  Url: "https://YOUR-TARGET.ngrok-free.app/api/chat"
  Content: JSON
  Query-Attribute: "query"
  Output-Attribute: "answer"

Attacks:
    - Path: /attacks/promptInjection.atk
    - Path: /attacks/smuggling.atk
    - Path: /attacks/jailbreak.atk

Mutation:
  Enabled: false               # true = 각 행동을 뮤테이션된 jailbreak 템플릿으로 감쌈
  Provider: gemini             # anthropic | openai | gemini
  Model: gemini-2.0-flash
  # APIKey: "AIza..."          # 또는 GEMINI_API_KEY 환경변수 사용
  Temperature: 1.0
  MaxTokens: 512
  Strategies:                  # GPTFuzz 뮤테이터 중 랜덤 선택
    - GenerateSimilar
    - CrossOver
    - Expand
    - Shorten
    - Rephrase
  Concatenate: true            # 뮤테이션 결과 뒤에 원본 템플릿 추가
  SeedsPath: "seeds/seed_short_25.csv"
  MaxRetries: 3                # 거부 → 뮤테이션 → 재시도 횟수
  RetryStrategies:             # 재시도용 direct 뮤테이터 (플레이스홀더 불필요)
    - DirectRephrase
    - DirectExpand
    - DirectShorten
    - DirectCrossOver

PacketFuzz:
  Placeholder: "AAAAAAAAAAAAAAAAAAA"
  DatasetPath: "HarmBench/data/behavior_datasets/harmbench_behaviors_text_test.csv"
  # SemanticCategories: [cybercrime_intrusion, illegal]
  # FunctionalCategories: [standard, contextual]
  # Limit: 20
  SavePoC: false

HarmBench:
  DatasetPath: "HarmBench/data/behavior_datasets/harmbench_behaviors_text_test.csv"
  # SemanticCategories: [cybercrime_intrusion, chemical_biological, illegal]
  # FunctionalCategories: [standard, contextual]
  # Limit: 50
  SavePoC: false
